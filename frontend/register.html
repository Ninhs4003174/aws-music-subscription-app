<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Subscription - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="login.html" aria-label="Music Subscription login">
    <span class="brand-mark">M</span>
    <span>Music Subscription</span>
  </a>

  <nav class="topnav" aria-label="Primary navigation">
    <a href="login.html">Login</a>
  </nav>
</header>

<main>
  <section class="auth-layout">
    <div class="hero-copy auth-copy">
      <p class="eyebrow">Create account</p>
      <h1>Register to start saving your music subscriptions.</h1>
      <p class="hero-text">Create your app account, then sign in to search music and manage your collection.</p>
    </div>

    <section class="panel auth-panel" aria-label="Register form">
      <div class="section-heading">
        <div>
          <p class="panel-label">Register</p>
          <h2>Sign up</h2>
        </div>
      </div>

      <form class="query-form auth-form" id="register-form">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" placeholder="student@example.com" required>
        </label>

        <label>
          Username
          <input type="text" name="user_name" autocomplete="username" placeholder="Student name" required>
        </label>

        <label>
          Password
          <input type="password" name="password" autocomplete="new-password" placeholder="Password" required>
        </label>

        <p class="message" id="register-message" hidden></p>

        <div class="form-actions">
          <button class="button" type="submit">Register</button>
        </div>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    </section>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>
</body>
</html>
